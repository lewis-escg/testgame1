    function shadeHex(hex, amount) {
      const raw = String(hex || "#888888").replace("#", "");
      const full = raw.length === 3 ? raw.split("").map(c => c + c).join("") : raw;
      const num = parseInt(full, 16);
      const r = Math.max(0, Math.min(255, ((num >> 16) & 255) + amount));
      const g = Math.max(0, Math.min(255, ((num >> 8) & 255) + amount));
      const b = Math.max(0, Math.min(255, (num & 255) + amount));
      return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);

    const FX = { bubbles: [], motes: [], blood: [] };

    let harpoon = null, harpoonConstraint = null, hookJoints = [], hookedFish = [], reelActive = false, spearDir = null;
    let dragConstraint = null, draggedFish = null;

    const UPGRADE_MAX = 4;
    const UPGRADE_COST = { oxygen: [8, 14, 22, 32], speed: [8, 16, 24, 34], depth: [10, 18, 28, 40] };
    let anglerThisDive = false, diveCd = 0;
    const bell = { parts: [], floor: null, roof: null, doors: [], hook: null, winch: null, park: { x: 0, y: 0 }, doorOpen: true, mode: "docked", swayT: 0, shakeT: 0, pendX: 0, pendV: 0 };
    const SHAFT_HALF = 78;
    const EntityRegistry = {

    function createHumanoid(x, y, scale, options) {
      options = options || {};

      const filter = options.npc ? { group, category: COL.npc, mask: COL.world } : { group, category: COL.player, mask: COL.world | COL.player | COL.bell | COL.gap | COL.floor };

      const torso = Bodies.rectangle(x, y, 20 * scale, 30 * scale, { label: "torso", collisionFilter: filter, render: { fillStyle: shirt }, density: 0.0032, frictionAir: 0.05, friction: 0.25 });
      const leftArm = Bodies.rectangle(x - 16 * scale, y - 2 * scale, 8 * scale, 26 * scale, { label: "leftArm", collisionFilter: filter, render: { fillStyle: skin }, density: 0.0015, frictionAir: 0.05 });

      const rightLeg = Bodies.rectangle(x + 7 * scale, y + 30 * scale, 9 * scale, 26 * scale, { label: "rightLeg", collisionFilter: filter, render: { fillStyle: pants }, density: 0.0022, frictionAir: 0.04, friction: 0.4 });
      const hidden = { visible: false, anchors: false };
      const constraints = [
        Constraint.create({ bodyA: head, bodyB: torso, pointA: { x: 0, y: 9 * scale }, pointB: { x: 0, y: -15 * scale }, stiffness: 1, length: 1, render: hidden }),
        Constraint.create({ bodyA: torso, bodyB: leftArm, pointA: { x: -10 * scale, y: -12 * scale }, pointB: { x: 0, y: -11 * scale }, stiffness: 0.7, length: 3, render: hidden }),
        Constraint.create({ bodyA: torso, bodyB: rightArm, pointA: { x: 10 * scale, y: -12 * scale }, pointB: { x: 0, y: -11 * scale }, stiffness: 0.7, length: 3, render: hidden }),
        Constraint.create({ bodyA: torso, bodyB: leftLeg, pointA: { x: -6 * scale, y: 15 * scale }, pointB: { x: 0, y: -12 * scale }, stiffness: 0.85, length: 2, render: hidden }),
        Constraint.create({ bodyA: torso, bodyB: rightLeg, pointA: { x: 6 * scale, y: 15 * scale }, pointB: { x: 0, y: -12 * scale }, stiffness: 0.85, length: 2, render: hidden })
      ];
      return { composite: Composite.create({ bodies: [head, torso, leftArm, rightArm, leftLeg, rightLeg], constraints }), head, torso, leftArm, rightArm, leftLeg, rightLeg, scale, constraints, ragdoll: false, ragdollTimer: 0, stun: 0, getHeadPos() { return head.position; }, setPosition(nx, ny) { Composite.translate(this.composite, { x: nx - torso.position.x, y: ny - torso.position.y }); } };
    }
    function createFish(x, y, typeKey) {
      const def = CONFIG.fishTypes[typeKey];
      const s = def.rare ? 4.0 : (0.75 + Math.random() * 0.55);
      const group = Body.nextGroup(true);
      const filter = { group, category: COL.fish, mask: COL.fish | COL.player | COL.gap | COL.world | COL.bell | COL.floor | COL.hook };
      const hidden = { visible: false, anchors: false };
      const segs = [], constraints = [], L = def.length * s, H = def.height * s, col = def.color;
      function link(a, b, pa, pb) { constraints.push(Constraint.create({ bodyA: a, bodyB: b, pointA: { x: pa, y: 0 }, pointB: { x: pb, y: 0 }, stiffness: 0.28, damping: 0.12, length: 2, render: hidden })); }
      if (def.shape === "puffer") {
        const head = Bodies.circle(x, y, H * 0.55, { label: "fishHead", collisionFilter: filter, render: { fillStyle: col }, density: 0.0008, frictionAir: 0.18 });
        const tail = Bodies.rectangle(x + H * 0.7, y, 8 * s, 10 * s, { label: "fishTail", collisionFilter: filter, render: { fillStyle: shadeHex(col, -35) }, density: 0.0003, frictionAir: 0.18 });
        segs.push(head, tail); link(head, tail, H * 0.5, -4);
      } else if (def.shape === "sole") {
        const head = Bodies.rectangle(x, y, L * 0.4, H * 1.5, { label: "fishHead", collisionFilter: filter, render: { fillStyle: shadeHex(col, 12) }, density: 0.0008, frictionAir: 0.18 });
        const mid = Bodies.rectangle(x + L * 0.28, y, L * 0.34, H, { label: "fishBody", collisionFilter: filter, render: { fillStyle: col }, density: 0.0006, frictionAir: 0.18 });
        const tail = Bodies.rectangle(x + L * 0.5, y, L * 0.2, H * 0.85, { label: "fishTail", collisionFilter: filter, render: { fillStyle: shadeHex(col, -25) }, density: 0.0004, frictionAir: 0.18 });
        segs.push(head, mid, tail); link(head, mid, L * 0.18, -L * 0.16); link(mid, tail, L * 0.16, -L * 0.08);
      } else if (def.shape === "angler") {
        const n = 9, segW = L / n, step = segW * 0.7;
        for (let i = 0; i < n; i++) {
          const body = Bodies.rectangle(x + i * step, y, segW * 1.15, H * (i === 0 ? 1.45 : 1 - i / n * 0.5), { label: i === 0 ? "fishHead" : "fishBody", collisionFilter: filter, render: { fillStyle: i === 0 ? "#3a3224" : col }, density: 0.0008, frictionAir: 0.16 });
          segs.push(body); if (i > 0) link(segs[i - 1], body, step * 0.5, -step * 0.5);
        }
        const jaw = Bodies.rectangle(x - 18 * s, y + 16 * s, 34 * s, 10 * s, { label: "fishJaw", collisionFilter: filter, render: { fillStyle: "#1a1610" }, density: 0.0004, frictionAir: 0.16 });
        const toothL = Bodies.rectangle(x - 28 * s, y + 8 * s, 8 * s, 14 * s, { label: "fishTooth", collisionFilter: filter, render: { fillStyle: "#c8c0a8" }, density: 0.0002, frictionAir: 0.16 });
        const toothR = Bodies.rectangle(x - 10 * s, y + 8 * s, 8 * s, 14 * s, { label: "fishTooth", collisionFilter: filter, render: { fillStyle: "#c8c0a8" }, density: 0.0002, frictionAir: 0.16 });
        const lure = Bodies.circle(x - 46 * s, y - 34 * s, 10 * s, { label: "fishWeak", collisionFilter: filter, render: { fillStyle: "#e8d56a" }, density: 0.0002, frictionAir: 0.16 });
        segs.push(jaw, toothL, toothR, lure);
        link(segs[0], jaw, -segW * 0.45, 10); link(jaw, toothL, -12 * s, 0); link(jaw, toothR, 8 * s, 0); link(segs[0], lure, -segW * 0.7, 6);
      } else {
        const n = def.segments, segW = L / n, step = segW * 0.72;
        for (let i = 0; i < n; i++) {
          const body = Bodies.rectangle(x + i * step, y, segW, H * (i === 0 ? 1.12 : 1 - i / n * (def.shape === "eel" ? 0.35 : 0.18)), { label: i === 0 ? "fishHead" : "fishBody", collisionFilter: filter, render: { fillStyle: i === 0 ? shadeHex(col, 16) : col }, density: 0.0007, frictionAir: 0.18 });
          segs.push(body); if (i > 0) link(segs[i - 1], body, step * 0.5, -step * 0.5);
        }
        const tail = Bodies.rectangle(x + n * step, y, 10 * s, H * (def.shape === "eel" ? 0.55 : 1.0), { label: "fishTail", collisionFilter: filter, render: { fillStyle: shadeHex(col, -28) }, density: 0.0003, frictionAir: 0.18 });
        segs.push(tail); link(segs[segs.length - 2], tail, segW * 0.4, -6);
      }
      for (const seg of segs) { seg.ignoreGravity = true; seg.frictionAir = 0.04; }
      const spaces = [];
      for (let i = 1; i < segs.length; i++) spaces.push(Math.max(8, Math.hypot(segs[i].position.x - segs[i-1].position.x, segs[i].position.y - segs[i-1].position.y)));
      return {
        composite: Composite.create({ bodies: segs, constraints }), head: segs[0], segments: segs, spaces, typeKey, def, rawColor: col, waveT: 0,
        alive: true, targetDir: Math.random() * Math.PI * 2, speed: def.speed * (0.9 + Math.random() * 0.25),
        aggression: def.aggression, offMs: 0, cook: 0, attached: false, inBell: false,
        hp: def.rare ? 10 : 1, critKill: false, slamCd: 1.2, cageLocked: false,
        update() {
          if (!this.alive) return;
          for (const seg of this.segments) {
            seg.ignoreGravity = true;
            if (seg.velocity.y < 0) Body.setVelocity(seg, { x: seg.velocity.x, y: 0 });
          }
          const top = CONFIG.waterY + 100;
          const bot = CONFIG.islandY + currentMaxDepth() + 40;
          if (Math.random() < 0.03) this.targetDir += (Math.random() - 0.5) * 1.6;
          if (this.head.position.y < top + 20) this.targetDir = 0.6 + Math.random() * 1.9;
          if (this.head.position.y > bot - 40) this.targetDir = -0.6 - Math.random() * 1.9;
          if (player && player.torso.position.y > CONFIG.waterY) {
            const dx = player.torso.position.x - this.head.position.x, dy = player.torso.position.y - this.head.position.y;
            const dist = Math.hypot(dx, dy);
            if (this.def.rare) {
              /* chase only happens in trySlam while charging */
            } else if (dist < 230) this.targetDir = this.aggression > 0.5 ? Math.atan2(dy, dx) : Math.atan2(-dy, -dx);
          }
          let diff = this.targetDir - this.head.angle;
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          Body.setAngle(this.head, this.head.angle + diff * 0.12);
          this.waveT = (this.waveT || 0) + 0.14;
          const face = this.head.angle + Math.sin(this.waveT) * 0.18;
          Body.setAngle(this.head, face);
          const swim = 3.6 + this.speed * 2.4;
          let svx = Math.cos(face) * swim, svy = Math.sin(face) * swim;
          if (this.head.position.y < top + 8 && svy < 0) svy = Math.abs(svy);
          Body.setVelocity(this.head, { x: svx, y: svy });
          Body.setAngularVelocity(this.head, 0);
          for (const c of this.composite.constraints) c.stiffness = 0.0001;
          for (let i = 1; i < this.segments.length; i++) {
            const seg = this.segments[i], lead = this.segments[i - 1];
            const space = (this.spaces && this.spaces[i - 1]) || 14;
            if (seg.label === "fishWeak" || seg.label === "fishJaw" || seg.label === "fishTooth") {
              const sc = this.def.rare ? 4 : 1;
              const off = seg.label === "fishWeak" ? [-46, -34] : seg.label === "fishJaw" ? [-18, 16] : (seg.position.x < this.head.position.x - 20 ? [-28, 8] : [-10, 8]);
              const ox = off[0] * sc, oy = off[1] * sc;
              Body.setPosition(seg, { x: this.head.position.x + Math.cos(face) * ox - Math.sin(face) * oy, y: this.head.position.y + Math.sin(face) * ox + Math.cos(face) * oy });
              Body.setAngle(seg, face);
              Body.setVelocity(seg, this.head.velocity);
              Body.setAngularVelocity(seg, 0);
              continue;
            }
            let dx = seg.position.x - lead.position.x, dy = seg.position.y - lead.position.y;
            let d = Math.hypot(dx, dy);
            if (d < 2) { dx = -Math.cos(face); dy = -Math.sin(face); d = 1; }
            Body.setPosition(seg, { x: lead.position.x + dx / d * space, y: lead.position.y + dy / d * space });
            Body.setAngle(seg, Math.atan2(lead.position.y - seg.position.y, lead.position.x - seg.position.x));
            Body.setVelocity(seg, { x: 0, y: 0 });
            Body.setAngularVelocity(seg, 0);
          }
          if (this.head.position.y < top) Body.setPosition(this.head, { x: this.head.position.x, y: top });
          if (this.def.rare) this.trySlam();
        },
        trySlam() {
          if (!bell.floor || bell.mode === "docked") return;
          this.slamCd = (this.slamCd || 0) - 0.016;
          const c = bellCenter();
          let nearest = 1e9;
          for (const seg of this.segments) nearest = Math.min(nearest, Math.hypot(seg.position.x - c.x, seg.position.y - c.y));

        kill() { this.alive = false; for (const c of this.composite.constraints) c.stiffness = 0.2; for (const seg of this.segments) { seg.ignoreGravity = true; Body.setAngularVelocity(seg, 0); } this.setMask(HAUL_MASK); }

    }
    const SPAWN_POOL = ["safe_cod","safe_cod","haddock","haddock","mackerel","mackerel","sea_bass","pollock","passive_sole","passive_sole","aggressive_barracuda","conger_eel","toxic_puffer","lionfish","stonefish","oilfish","bluefin","opah","king_salmon"];
    function spawnFishAtEdge(forcedType) {
      const type = forcedType || SPAWN_POOL[Math.floor(Math.random() * SPAWN_POOL.length)];
      const b = render && render.bounds ? render.bounds : { min: { x: CONFIG.worldX - 400, y: CONFIG.waterY + 200 }, max: { x: CONFIG.worldX + 400, y: CONFIG.islandY + 800 } };
      const top = CONFIG.waterY + 110, bot = CONFIG.islandY + currentMaxDepth() + 80;
      let viewTop = Math.max(top, b.min.y);
      let viewBot = Math.min(bot, b.max.y);
      if (viewBot - viewTop < 160) { viewTop = top; viewBot = Math.min(bot, top + 500); }
      const band = Math.random();
      let y;
      if (band < 0.35) y = viewTop + Math.random() * Math.max(40, viewBot - viewTop);
      else if (band < 0.7) y = Math.min(bot - 20, viewBot + Math.random() * 220);
      else y = top + Math.random() * Math.max(120, (viewBot + 180) - top);
      y = Math.max(top, Math.min(bot - 10, y));
      const side = Math.random();
      let x, dir;

      const panel = document.getElementById("dialogue-panel");
      document.getElementById("dialogue-speaker").textContent = "Shop";
      document.getElementById("dialogue-text").textContent = "Cash: " + money + ". Upgrades stay for the session.";
      const row = (key, label) => { const lv = upgrades[key], maxed = lv >= UPGRADE_MAX, cost = maxed ? "-" : UPGRADE_COST[key][lv]; return '<button class="bg-stone-800 text-stone-200 text-sm px-3 py-1 border border-stone-600" onclick="buyUpgrade(\'' + key + '\')">' + label + " " + lv + "/" + UPGRADE_MAX + (maxed ? " MAX" : " (" + cost + ")") + "</button>"; };
      document.getElementById("dialogue-choices").innerHTML = row("oxygen", "Oxygen") + row("speed", "Hook speed") + row("depth", "Cage depth") + '<button class="bg-stone-800 text-stone-200 text-sm px-3 py-1 border border-stone-600" onclick="document.getElementById(\'dialogue-panel\').classList.add(\'hidden\')">Close</button>';
      panel.classList.remove("hidden");
    }
    function setPlayerWorldCollide(on) {
      if (!player) return;
      const mask = on ? (COL.world | COL.player | COL.bell | COL.gap | COL.floor) : (COL.player | COL.bell | COL.floor);
      for (const b of player.composite.bodies) b.collisionFilter.mask = mask;
    }
    function handleBellCommand() {
      const near = player && Math.hypot(player.torso.position.x - bellCenter().x, player.torso.position.y - bellCenter().y) < 130;
      if (!near && !playerInsideBell()) return;
      if (bell.mode === "docked") {
        if (bell.doorOpen) { if (!playerInsideBell()) return; setDoorOpen(false); showToast("Door sealed. Press E again to descend.", "Cage"); }
        else if (!playerInsideBell()) setDoorOpen(true);
        else {
          if (diveCd > 0) { showToast("Cage cooling. " + Math.ceil(diveCd) + "s.", "Cage"); return; }
          bell.mode = "descending"; setPlayerWorldCollide(false); anglerThisDive = false; showToast("Descending.", "Cage");
        }
        document.getElementById("bell-status").textContent = "CAGE " + bell.mode + " / " + (bell.doorOpen ? "door open" : "door sealed"); return;
      }
      if (bell.mode === "descending" || bell.mode === "holding") { bell.mode = "ascending"; showToast("Ascending.", "Cage"); document.getElementById("bell-status").textContent = "CAGE " + bell.mode + " / door sealed"; }
    }
    function stepBell(dt) {
      let dx = 0, dy = 0; bell.swayT += dt;
      if (bell.mode === "descending") { dy = CONFIG.descendSpeed; if (bell.floor.position.y >= CONFIG.islandY + currentMaxDepth()) { dy = 0; bell.mode = "holding"; trySpawnAngler(); } }
      else if (bell.mode === "ascending") {
        dy = -CONFIG.ascendSpeed; const parkY = bell.park.y + 68;
        if (bell.floor.position.y + dy <= parkY) { dy = parkY - bell.floor.position.y; translateBell(0, dy); if (playerInsideBell() || !bell.doorOpen) carryPlayerWithBell(0, dy); carryBellCargo(0, dy); bell.mode = "docked"; bell.shakeT = 0.85; setDoorOpen(true); setPlayerWorldCollide(true); diveCd = 15; showToast("Surface. Doors open. Cage cools 15s.", "Cage"); return; }
      }
      if (bell.mode !== "docked") {
        bell.pendV += -bell.pendX * 7 * dt;
        bell.pendV *= 0.985;
        bell.pendX += bell.pendV * dt;
        const targetX = CONFIG.worldX + bell.pendX;
        dx += targetX - bell.floor.position.x;
      } else { bell.pendX *= 0.8; bell.pendV *= 0.8; }
      if (bell.shakeT > 0) { bell.shakeT -= dt; dx += (Math.random() - 0.5) * 1.2; }
      if (dx || dy) { translateBell(dx, dy); if (playerInsideBell() || !bell.doorOpen) carryPlayerWithBell(dx, dy); carryBellCargo(dx, dy); }
    }
    function spawnBlood(x, y, vel, crit) { for (let i = 0; i < 8; i++) FX.blood.push({ x, y, vx: (vel.x || 0) * 0.35 + (Math.random() - 0.5) * 2.2, vy: (vel.y || 0) * 0.35 + (Math.random() - 0.5) * 2.2, size: 2 + Math.random() * 3, life: 1, crit: !!crit }); }
    function updateFx(dt) {
      const waterTop = CONFIG.waterY, view = render.bounds;
      if (view.max.y > waterTop + 8) {
        if (Math.random() < 0.08) { const y = Math.max(waterTop + 24, view.min.y + 10) + Math.random() * Math.max(30, view.max.y - Math.max(waterTop + 24, view.min.y)); if (y > waterTop + 16) FX.bubbles.push({ x: view.min.x + 40 + Math.random() * Math.max(20, view.max.x - view.min.x - 80), y, size: 0, max: 5 + Math.random() * 8, life: 1, vy: -18 - Math.random() * 16 }); }
        if (Math.random() < 0.12) { const y = Math.max(waterTop + 18, view.min.y) + Math.random() * Math.max(20, view.max.y - Math.max(waterTop + 18, view.min.y)); if (y > waterTop + 10) FX.motes.push({ x: view.min.x + Math.random() * Math.max(20, view.max.x - view.min.x), y, size: 1 + Math.random() * 2, life: 0, grow: 1, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 4 }); }
      }
      for (const b of FX.bubbles) { b.y += b.vy * dt; b.size = Math.min(b.max, b.size + dt * 10); b.life -= dt * 0.25; if (b.y <= waterTop) b.life = 0; } FX.bubbles = FX.bubbles.filter(b => b.life > 0);
      for (const m of FX.motes) { m.x += m.vx * dt; m.y += m.vy * dt; if (m.y <= waterTop) m.life = 0; if (m.grow) { m.life += dt * 0.35; if (m.life >= 1) m.grow = 0; } else m.life -= dt * 0.18; } FX.motes = FX.motes.filter(m => m.life > 0);
      for (const p of FX.blood) { p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; p.size += dt * 6; p.life -= dt * 0.7; } FX.blood = FX.blood.filter(p => p.life > 0);
    }
    function drawBackground() {
      const ctx = render.context, bounds = render.bounds, w = render.options.width, h = render.options.height, surfaceScreenY = CONFIG.waterY - bounds.min.y;
      ctx.fillStyle = "#0a0d11"; ctx.fillRect(0, 0, w, h);
      if (surfaceScreenY > 0) { const sky = ctx.createLinearGradient(0, 0, 0, Math.min(h, surfaceScreenY)); sky.addColorStop(0, "#090b0e"); sky.addColorStop(1, "#14181e"); ctx.fillStyle = sky; ctx.fillRect(0, 0, w, Math.min(h, surfaceScreenY)); }
      if (surfaceScreenY < h) {
        const y0 = Math.max(0, surfaceScreenY), depth = Math.max(0, (camera.y || CONFIG.waterY) - CONFIG.waterY), t = Math.min(1, depth / 900), mix = (a, b) => Math.round(a + (b - a) * t);
        const grad = ctx.createLinearGradient(0, y0, 0, h);
        grad.addColorStop(0, "rgb(" + mix(22, 6) + "," + mix(58, 16) + "," + mix(62, 22) + ")");
        grad.addColorStop(0.45, "rgb(" + mix(12, 4) + "," + mix(36, 10) + "," + mix(44, 16) + ")");
        grad.addColorStop(1, "rgb(" + mix(4, 2) + "," + mix(12, 4) + "," + mix(16, 8) + ")");
        ctx.fillStyle = grad; ctx.fillRect(0, y0, w, h - y0);
      }
      ctx.fillStyle = "rgba(4, 8, 10, 0.55)"; ctx.fillRect(CONFIG.worldX - SHAFT_HALF - bounds.min.x, CONFIG.islandY - 20 - bounds.min.y, SHAFT_HALF * 2, h);
    }
    function drawLabels() {
      const ctx = render.context, bounds = render.bounds, c = bellCenter();
      if (bell.winch && bell.hook) { ctx.strokeStyle = "#8a8070"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(bell.winch.position.x - bounds.min.x, bell.winch.position.y - bounds.min.y); ctx.lineTo(bell.hook.position.x - bounds.min.x, bell.hook.position.y - bounds.min.y); ctx.stroke(); }
      ctx.fillStyle = "#c8c0a8"; ctx.font = "12px Courier New, monospace"; ctx.textAlign = "center";
      ctx.fillText(bell.doorOpen ? "DOORS OPEN" : "DOORS SHUT", c.x - bounds.min.x, c.y - 96 - bounds.min.y);
      ctx.fillText("Hungry", CONFIG.worldX + 250 - bounds.min.x, CONFIG.islandY - 92 - bounds.min.y);
      ctx.fillText("Grill", CONFIG.worldX + 160 - bounds.min.x, CONFIG.islandY - 18 - bounds.min.y);
      ctx.fillText("Shop", CONFIG.worldX - 270 - bounds.min.x, CONFIG.islandY - 92 - bounds.min.y);
      ctx.font = "11px Courier New, monospace";
      for (const e of EntityRegistry.entities) {
        if (!e.def || !e.head) continue;
        const show = discovered.has(e.typeKey) || e === draggedFish;
        if (!show) continue;
        ctx.fillStyle = e === draggedFish ? "#efd36a" : "#c8c0a8";
        ctx.fillText(e.def.name, e.head.position.x - bounds.min.x, e.head.position.y - bounds.min.y + 22);
      }
      for (const m of FX.motes) { if (m.y <= CONFIG.waterY) continue; ctx.globalAlpha = Math.max(0, Math.min(1, m.life)) * 0.25; ctx.fillStyle = "#9bb8b0"; ctx.fillRect(m.x - bounds.min.x, m.y - bounds.min.y, m.size, m.size); }
      for (const b of FX.bubbles) { if (b.y <= CONFIG.waterY) continue; ctx.globalAlpha = Math.max(0, b.life) * 0.45; ctx.strokeStyle = "#b7d4d0"; ctx.strokeRect(b.x - bounds.min.x - b.size / 2, b.y - bounds.min.y - b.size / 2, b.size, b.size); }
      for (const p of FX.blood) { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.crit ? "#3d8a4a" : "#7a1c1c"; ctx.fillRect(p.x - bounds.min.x - p.size / 2, p.y - bounds.min.y - p.size / 2, p.size, p.size); }
      ctx.globalAlpha = 1;
    }
    function init() {
      engine = Engine.create(); world = engine.world; engine.gravity.x = 0; engine.gravity.y = 1.05;
      render = Render.create({ canvas: document.getElementById("game-canvas"), engine, options: { width: CONFIG.width, height: CONFIG.height, wireframes: false, background: "#07090d", hasBounds: true, pixelRatio: window.devicePixelRatio || 1 } });
      Composite.add(world, createIsland()); Composite.add(world, createCrane()); Composite.add(world, createDivingBell(CONFIG.worldX, CONFIG.islandY - 36));
      player = createHumanoid(CONFIG.worldX - 90, CONFIG.islandY - 20, CONFIG.playerScale, { isPlayer: true, shirt: "#1c252c" }); EntityRegistry.register(player); lastSafeY = player.torso.position.y;
      hungryNpc = createNPC(CONFIG.worldX + 250, CONFIG.islandY - 6, "Hungry", "", { shirt: "#3b2416", pants: "#140e0a" }); Body.scale(hungryNpc.torso, 1.25, 1.15); EntityRegistry.register(hungryNpc);
      shopNpc = createNPC(CONFIG.worldX - 270, CONFIG.islandY - 6, "Shop", "", { shirt: "#24322a" }); EntityRegistry.register(shopNpc);
      grill = Bodies.rectangle(CONFIG.worldX + 160, CONFIG.islandY + 10, 54, 16, { isStatic: true, label: "grill", render: { fillStyle: "#4a2a16" } }); Composite.add(world, grill);
      function addRocks(side) { const baseX = side < 0 ? CONFIG.worldX - 420 + Math.random() * 80 : CONFIG.worldX + 340 + Math.random() * 80, baseY = 560 + Math.random() * 1200; for (let i = 0; i < 3 + Math.floor(Math.random() * 3); i++) Composite.add(world, Bodies.rectangle(baseX + (Math.random() - 0.5) * 50, baseY + i * 22, 28 + Math.random() * 48, 18 + Math.random() * 28, { isStatic: true, label: "rock", collisionFilter: { category: COL.world, mask: COL.player | COL.fish | COL.hook }, render: { fillStyle: i % 2 ? "#1a2830" : "#152026" } })); }
      for (let i = 0; i < 5; i++) addRocks(-1); for (let i = 0; i < 5; i++) addRocks(1);
      setupCollisions(); Events.on(render, "beforeRender", drawBackground); Events.on(render, "afterRender", drawLabels);
      Runner.run(Runner.create(), engine); Render.run(render);
      let last = performance.now(); function loop(now) { const dt = Math.min((now - last) / 1000, 0.05); last = now; update(dt); requestAnimationFrame(loop); } requestAnimationFrame(loop);
      window.addEventListener("resize", () => { CONFIG.width = window.innerWidth; CONFIG.height = window.innerHeight; render.options.width = CONFIG.width; render.options.height = CONFIG.height; render.canvas.width = CONFIG.width; render.canvas.height = CONFIG.height; });
    }
    function update(dt) {
      if (!player) return;
      if (keys.KeyE) { keys.KeyE = false; if (!tryUseNearby()) handleBellCommand(); }
      stepBell(dt);
      const torso = player.torso; let vx = torso.velocity.x, vy = torso.velocity.y;
      if (keys.KeyA || keys.ArrowLeft) vx = -CONFIG.walkSpeed; else if (keys.KeyD || keys.ArrowRight) vx = CONFIG.walkSpeed; else vx *= 0.78;
      if (vy < -14) vy = -14; if (vy > 16) vy = 16;
      if (keys.Space && grounded && !jumpLocked && !player.ragdoll) {
        const under = player.torso.position.y > CONFIG.waterY;
        let jump = CONFIG.jumpSpeed * (under ? 1.3 : 0.4);
        if (bell.mode === "docked" && playerInsideBell()) jump *= 1.5;
        vy = -jump;
        for (const b of player.composite.bodies) Body.setVelocity(b, { x: b.velocity.x, y: vy });
        jumpLocked = true; grounded = false;
      }
      if (player.stun > 0) { player.stun -= dt; vx *= 0.2; }
      if (player.ragdoll) { player.ragdollTimer -= dt; if (player.ragdollTimer <= 0 && (grounded || player.torso.position.y > CONFIG.waterY)) setRagdoll(false); }
      else { Body.setVelocity(torso, { x: vx, y: vy }); standPose(); }
      if (player.torso.position.y > CONFIG.waterY) { const g = engine.gravity.y * (engine.gravity.scale || 0.001); for (const b of player.composite.bodies) Body.applyForce(b, b.position, { x: 0, y: -b.mass * g * 0.18 }); }
      if (grounded) lastSafeY = torso.position.y; else if (torso.position.y - lastSafeY > CONFIG.playerScale * 80 * 5) { if (!player.ragdoll) setRagdoll(true, 3); lastSafeY = torso.position.y; }
      keepPlayerInBell(); pinLockedAnglers(); updateFishWorld(dt); handleDrag(); maintainFish(dt); updateFx(dt);
      if (diveCd > 0) diveCd = Math.max(0, diveCd - dt);
      if (bell.mode !== "docked") {
        oxygen -= currentDrain() * dt;
        if (oxygen <= 0) { oxygen = 0; bell.mode = "ascending"; if (!player.ragdoll) setRagdoll(true, 99); player.ragdollTimer = 99; showToast("Oxygen gone. Cage returning.", "Cage"); }
      } else { oxygen = Math.min(maxOxygen, oxygen + 18 * dt); if (oxygen > 8 && player.ragdollTimer > 10) setRagdoll(false); }
      if (oxygen <= 0 && bell.mode !== "docked") { setRagdoll(true, 99); player.ragdollTimer = 99; }
      if (mouse.down && bell.mode !== "docked" && !(player.stun > 0)) { shootHarpoon(); mouse.down = false; }
      if (harpoon && player) {
        const maxHook = (player.head.position.y - render.bounds.min.y) + 90;
        if (hookedFish.length === 0 && Math.hypot(harpoon.position.x - player.head.position.x, harpoon.position.y - player.head.position.y) > maxHook) releaseHarpoon();
      }
      if (harpoon) {
        Body.setAngularVelocity(harpoon, harpoon.angularVelocity * 0.35);
        if (spearDir && !reelActive) { const hv = harpoon.velocity, mag = Math.hypot(hv.x, hv.y) || 1, mix = 0.45; Body.setVelocity(harpoon, { x: hv.x * (1 - mix) + spearDir.x * mag * mix, y: hv.y * (1 - mix) + spearDir.y * mag * mix }); }
        const hv2 = harpoon.velocity; if (Math.hypot(hv2.x, hv2.y) > 0.4) Body.setAngle(harpoon, Math.atan2(hv2.y, hv2.x));
      }
      if (mouse.right && harpoon) reelActive = true;
      if (reelActive && harpoon && harpoonConstraint) {
        const target = player.rightArm.position, dir = Vector.sub(target, harpoon.position), dist = Vector.magnitude(dir) || 1, n = Vector.normalise(dir);
        const pull = Math.min(currentPull(), dist * (0.12 + upgrades.speed * 0.03));
        Body.setVelocity(harpoon, { x: n.x * pull, y: n.y * pull }); Body.setAngularVelocity(harpoon, 0); harpoonConstraint.length = Math.max(20, dist);
        for (const fish of hookedFish) {
          fish.setMask(HAUL_MASK);
          for (const seg of fish.segments) { seg.ignoreGravity = true; Body.setAngularVelocity(seg, 0); Body.setVelocity(seg, { x: n.x * pull, y: n.y * pull }); }
        }
        if (dist < 40) dropHookedFish();
      }
      EntityRegistry.update(dt);
      camera.x = CONFIG.worldX; camera.y = player.getHeadPos().y;
      Render.lookAt(render, { min: { x: camera.x - CONFIG.width / 2, y: camera.y - CONFIG.height / 2 }, max: { x: camera.x + CONFIG.width / 2, y: camera.y + CONFIG.height / 2 } });
      document.getElementById("depth-display").textContent = Math.max(0, Math.round((bell.floor.position.y - (bell.park.y + 68)) / 10)) + " m";
      const ox = document.getElementById("oxygen-display"); ox.textContent = Math.round(oxygen) + "/" + maxOxygen; ox.style.color = oxygen < 30 ? "#c44" : "#9aa";
      document.getElementById("money-display").textContent = String(money); refreshUpgradeHud();
    }
    window.addEventListener("load", init);
  </script>
