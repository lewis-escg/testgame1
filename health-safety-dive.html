<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health &amp; Safety Dive – Level 3 Game Dev Prototype</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #07090d; height: 100%; }
    #game-canvas { display: block; width: 100vw; height: 100vh; background: #07090d; }
    .ui-panel { pointer-events: auto; }
    .dialogue-box { max-width: 420px; }
    .inventory-slot { min-width: 64px; min-height: 64px; }
  </style>
</head>
<body class="relative select-none">
  <canvas id="game-canvas"></canvas>

  <div id="ui-root" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-4">
    <div class="flex justify-between items-start">
      <div class="ui-panel bg-black/80 text-stone-200 px-4 py-2 border border-stone-700">
        <div class="text-xs text-stone-400 uppercase tracking-widest">Health &amp; Safety Dive</div>
        <div class="text-sm mt-1">Depth: <span id="depth-display">0 m</span> · Oxygen: <span id="oxygen-display">100%</span></div>
        <div class="text-xs text-stone-500 mt-1">A/D walk · Space jump · E door / dive / surface · LMB harpoon · RMB reel</div>
        <div id="bell-status" class="text-xs text-amber-600 mt-1">Bell: docked · door open</div>
      </div>
      <div class="ui-panel bg-black/80 text-stone-200 px-4 py-2 border border-stone-700">
        <div class="text-xs text-amber-700 uppercase tracking-widest">Cage Inventory</div>
        <div id="cage-inventory" class="flex gap-2 mt-2"></div>
      </div>
    </div>
    <div class="flex justify-center">
      <div id="dialogue-panel" class="ui-panel dialogue-box hidden bg-black/90 text-stone-200 p-5 border border-stone-700">
        <div id="dialogue-speaker" class="text-amber-600 font-semibold mb-1"></div>
        <div id="dialogue-text" class="text-sm leading-relaxed"></div>
        <div id="dialogue-choices" class="mt-3 flex flex-wrap gap-2"></div>
      </div>
    </div>
  </div>

  <div id="prep-modal" class="absolute inset-0 hidden items-center justify-center bg-black/70 pointer-events-auto">
    <div class="bg-zinc-950 text-stone-200 p-6 w-full max-w-md border border-stone-700">
      <h2 class="text-xl font-bold text-amber-700 mb-2">Prepare Fish</h2>
      <p id="prep-desc" class="text-sm text-stone-400 mb-4"></p>
      <div class="space-y-2 mb-4">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="prep-clean" />
          <span>Clean thoroughly (remove guts / scales)</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="prep-cook" />
          <span>Cook properly</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="prep-identify" />
          <span>Confirm species is edible for humans</span>
        </label>
      </div>
      <div class="flex gap-3">
        <button id="prep-confirm" class="flex-1 bg-stone-800 hover:bg-stone-700 border border-stone-600 py-2">Feed to Chef</button>
        <button id="prep-cancel" class="px-4 bg-black hover:bg-zinc-900 border border-stone-700 py-2">Cancel</button>
      </div>
      <p id="prep-result" class="mt-3 text-sm hidden"></p>
    </div>
  </div>

  <script>
    const { Engine, Render, Runner, Bodies, Body, Composite, Constraint, Events, Query, Vector } = Matter;

    function shadeHex(hex, amount) {
      const raw = String(hex || "#888888").replace("#", "");
      const full = raw.length === 3 ? raw.split("").map(c => c + c).join("") : raw;
      const num = parseInt(full, 16);
      const r = Math.max(0, Math.min(255, ((num >> 16) & 255) + amount));
      const g = Math.max(0, Math.min(255, ((num >> 8) & 255) + amount));
      const b = Math.max(0, Math.min(255, (num & 255) + amount));
      return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    const CONFIG = {
      width: window.innerWidth,
      height: window.innerHeight,
      islandY: 240,
      playerScale: 0.58,
      walkSpeed: 2.15,
      jumpSpeed: 7.2,
      harpoonSpeed: 16,
      reelForce: 0.007,
      oxygenDrainPerSec: 3.2,
      maxDepth: 1700,
      descendSpeed: 1.35,
      ascendSpeed: 1.7,
      fishTypes: {
        safe_cod: { name: "Atlantic Cod", color: "#24364f", segments: 6, length: 74, speed: 1.2, aggression: 0.1, edible: true, prepRequired: ["clean", "cook", "identify"], risk: "low" },
        toxic_puffer: { name: "Pufferfish", color: "#6a5414", segments: 5, length: 52, speed: 1.0, aggression: 0.55, edible: false, prepRequired: ["clean", "cook", "identify"], risk: "high" },
        passive_sole: { name: "Dover Sole", color: "#4a3b2c", segments: 7, length: 62, speed: 0.8, aggression: 0.0, edible: true, prepRequired: ["clean", "cook"], risk: "low" },
        aggressive_barracuda: { name: "Barracuda", color: "#24362c", segments: 8, length: 96, speed: 1.8, aggression: 0.85, edible: true, prepRequired: ["clean", "cook", "identify"], risk: "medium" }
      }
    };

    let engine, world, render;
    let player = null;
    let camera = { x: 0, y: 0 };
    let oxygen = 100;
    let harpoon = null;
    let harpoonConstraint = null;
    let reelActive = false;
    let cageInventory = [];
    let selectedFishForPrep = null;
    let grounded = false;
    let jumpLocked = false;

    const bell = {
      parts: [],
      walls: [],
      floor: null,
      roof: null,
      doors: [],
      park: { x: 0, y: 0 },
      doorOpen: true,
      mode: "docked", // docked | descending | holding | ascending
      innerW: 92,
      innerH: 118
    };

    const EntityRegistry = {
      entities: [],
      register(ent) {
        this.entities.push(ent);
        if (ent.composite) Composite.add(world, ent.composite);
        else if (ent.body) Composite.add(world, ent.body);
        return ent;
      },
      remove(ent) {
        const idx = this.entities.indexOf(ent);
        if (idx >= 0) this.entities.splice(idx, 1);
        if (ent.composite) Composite.remove(world, ent.composite);
        else if (ent.body) Composite.remove(world, ent.body);
      },
      update(dt) {
        for (const e of this.entities) if (e.update) e.update(dt);
      }
    };

    function createHumanoid(x, y, scale, options) {
      options = options || {};
      const group = Body.nextGroup(true);
      const skin = options.skin || "#8a6d52";
      const shirt = options.shirt || "#1a2228";
      const pants = options.pants || "#10141a";
      const head = Bodies.rectangle(x, y - 42 * scale, 20 * scale, 22 * scale, {
        label: "head", collisionFilter: { group },
        render: { fillStyle: skin }, density: 0.002, frictionAir: 0.05, chamfer: { radius: 1 }
      });
      const torso = Bodies.rectangle(x, y, 20 * scale, 34 * scale, {
        label: "torso", collisionFilter: { group },
        render: { fillStyle: shirt }, density: 0.0032, frictionAir: 0.05, friction: 0.25
      });
      const leftArm = Bodies.rectangle(x - 16 * scale, y - 2 * scale, 8 * scale, 26 * scale, {
        label: "leftArm", collisionFilter: { group },
        render: { fillStyle: skin }, density: 0.0015, frictionAir: 0.05
      });
      const rightArm = Bodies.rectangle(x + 16 * scale, y - 2 * scale, 8 * scale, 26 * scale, {
        label: "rightArm", collisionFilter: { group },
        render: { fillStyle: skin }, density: 0.0015, frictionAir: 0.05
      });
      const leftLeg = Bodies.rectangle(x - 7 * scale, y + 32 * scale, 9 * scale, 28 * scale, {
        label: "leftLeg", collisionFilter: { group },
        render: { fillStyle: pants }, density: 0.0022, frictionAir: 0.04, friction: 0.4
      });
      const rightLeg = Bodies.rectangle(x + 7 * scale, y + 32 * scale, 9 * scale, 28 * scale, {
        label: "rightLeg", collisionFilter: { group },
        render: { fillStyle: pants }, density: 0.0022, frictionAir: 0.04, friction: 0.4
      });

      const constraints = [
        Constraint.create({ bodyA: head, bodyB: torso, pointA: { x: 0, y: 11 * scale }, pointB: { x: 0, y: -17 * scale }, stiffness: 0.95, length: 2 }),
        Constraint.create({ bodyA: torso, bodyB: leftArm, pointA: { x: -10 * scale, y: -12 * scale }, pointB: { x: 0, y: -11 * scale }, stiffness: 0.7, length: 3 }),
        Constraint.create({ bodyA: torso, bodyB: rightArm, pointA: { x: 10 * scale, y: -12 * scale }, pointB: { x: 0, y: -11 * scale }, stiffness: 0.7, length: 3 }),
        Constraint.create({ bodyA: torso, bodyB: leftLeg, pointA: { x: -6 * scale, y: 17 * scale }, pointB: { x: 0, y: -12 * scale }, stiffness: 0.85, length: 2 }),
        Constraint.create({ bodyA: torso, bodyB: rightLeg, pointA: { x: 6 * scale, y: 17 * scale }, pointB: { x: 0, y: -12 * scale }, stiffness: 0.85, length: 2 })
      ];

      const composite = Composite.create({
        bodies: [head, torso, leftArm, rightArm, leftLeg, rightLeg],
        constraints
      });

      return {
        composite, head, torso, leftArm, rightArm, leftLeg, rightLeg, scale,
        isPlayer: !!options.isPlayer,
        name: options.name || "Humanoid",
        getHeadPos() { return head.position; },
        setPosition(nx, ny) {
          Composite.translate(composite, { x: nx - torso.position.x, y: ny - torso.position.y });
        }
      };
    }

    function createSegmentedFish(x, y, typeKey) {
      const def = CONFIG.fishTypes[typeKey] || CONFIG.fishTypes.safe_cod;
      const group = Body.nextGroup(true);
      const segs = [];
      const constraints = [];
      const segW = def.length / def.segments;
      const segH = 11;

      for (let i = 0; i < def.segments; i++) {
        const isHead = i === 0;
        const body = Bodies.rectangle(
          x + i * segW * 0.86, y,
          isHead ? segW * 1.05 : segW,
          isHead ? segH + 3 : segH,
          {
            label: isHead ? "fishHead" : "fishBody",
            collisionFilter: { group },
            render: { fillStyle: isHead ? shadeHex(def.color, -25) : def.color },
            density: 0.0006,
            frictionAir: 0.045
          }
        );
        segs.push(body);
        if (i > 0) {
          constraints.push(Constraint.create({
            bodyA: segs[i - 1], bodyB: body,
            pointA: { x: segW * 0.4, y: 0 }, pointB: { x: -segW * 0.4, y: 0 },
            stiffness: 0.88, damping: 0.12, length: 2
          }));
        }
      }

      const tail = Bodies.rectangle(x + def.segments * segW * 0.86, y, 10, 16, {
        label: "fishTail", collisionFilter: { group },
        render: { fillStyle: shadeHex(def.color, -35) }, density: 0.0003
      });
      constraints.push(Constraint.create({ bodyA: segs[segs.length - 1], bodyB: tail, stiffness: 0.55, length: 6 }));
      segs.push(tail);

      return {
        composite: Composite.create({ bodies: segs, constraints }),
        head: segs[0], segments: segs, typeKey, def,
        alive: true, targetDir: Math.random() * Math.PI * 2,
        aggression: def.aggression, speed: def.speed,
        update() {
          if (!this.alive) return;
          if (Math.random() < 0.02) this.targetDir += (Math.random() - 0.5) * 1.1;
          if (player) {
            const dx = player.torso.position.x - this.head.position.x;
            const dy = player.torso.position.y - this.head.position.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 260) {
              if (this.aggression > 0.5) this.targetDir = Math.atan2(dy, dx);
              else if (this.aggression < 0.2) this.targetDir = Math.atan2(-dy, -dx);
            }
          }
          const force = 0.00022 * this.speed;
          Body.applyForce(this.head, this.head.position, {
            x: Math.cos(this.targetDir) * force,
            y: Math.sin(this.targetDir) * force
          });
          Body.applyForce(this.head, this.head.position, { x: 0, y: -0.00003 });
        },
        kill() {
          this.alive = false;
          for (const c of this.composite.constraints) c.stiffness = 0.14;
        }
      };
    }

    function steel(fill) {
      return { isStatic: true, render: { fillStyle: fill || "#2a3036" }, friction: 0.8 };
    }

    function createDivingBell(cx, cy) {
      const w = 118;
      const h = 148;
      const t = 10;
      const doorH = 92;
      const lintelH = 28;
      const sillH = 18;
      const floor = Bodies.rectangle(cx, cy + h / 2 - t / 2, w, t, Object.assign(steel("#3a4148"), { label: "bellFloor" }));
      const roof = Bodies.rectangle(cx, cy - h / 2 + t / 2, w, t, Object.assign(steel("#32383e"), { label: "bellRoof" }));
      const leftTop = Bodies.rectangle(cx - w / 2 + t / 2, cy - h / 2 + lintelH / 2 + t, t, lintelH, Object.assign(steel("#2c3238"), { label: "bellWall" }));
      const rightTop = Bodies.rectangle(cx + w / 2 - t / 2, cy - h / 2 + lintelH / 2 + t, t, lintelH, Object.assign(steel("#2c3238"), { label: "bellWall" }));
      const leftSill = Bodies.rectangle(cx - w / 2 + t / 2, cy + h / 2 - sillH / 2 - t / 2, t, sillH, Object.assign(steel("#2c3238"), { label: "bellWall" }));
      const rightSill = Bodies.rectangle(cx + w / 2 - t / 2, cy + h / 2 - sillH / 2 - t / 2, t, sillH, Object.assign(steel("#2c3238"), { label: "bellWall" }));
      const leftDoor = Bodies.rectangle(cx - w / 2 + t / 2, cy + 10, t, doorH, Object.assign(steel("#5a4330"), { label: "bellDoor" }));
      const rightDoor = Bodies.rectangle(cx + w / 2 - t / 2, cy + 10, t, doorH, Object.assign(steel("#5a4330"), { label: "bellDoor" }));
      const hook = Bodies.rectangle(cx, cy - h / 2 - 14, 14, 20, Object.assign(steel("#4a5158"), { label: "bellHook" }));
      const lamp = Bodies.rectangle(cx, cy - h / 2 + 18, 16, 8, Object.assign(steel("#6b4e1e"), { label: "bellLamp" }));

      const parts = [floor, roof, leftTop, rightTop, leftSill, rightSill, leftDoor, rightDoor, hook, lamp];
      bell.parts = parts;
      bell.walls = [floor, roof, leftTop, rightTop, leftSill, rightSill, leftDoor, rightDoor];
      bell.floor = floor;
      bell.roof = roof;
      bell.doors = [
        {
          body: leftDoor,
          closed: { x: leftDoor.position.x, y: leftDoor.position.y },
          open: { x: leftDoor.position.x - 26, y: leftDoor.position.y - 86 }
        },
        {
          body: rightDoor,
          closed: { x: rightDoor.position.x, y: rightDoor.position.y },
          open: { x: rightDoor.position.x + 26, y: rightDoor.position.y - 86 }
        }
      ];
      bell.park = { x: cx, y: cy };
      setDoorOpen(true);
      return parts;
    }

    function bellCenter() {
      return bell.floor ? { x: bell.floor.position.x, y: bell.floor.position.y - 68 } : { x: CONFIG.width / 2, y: CONFIG.islandY };
    }

    function translateBell(dx, dy) {
      for (const part of bell.parts) {
        Body.setPosition(part, { x: part.position.x + dx, y: part.position.y + dy });
        Body.setVelocity(part, { x: 0, y: 0 });
      }
      for (const d of bell.doors) {
        d.closed.x += dx; d.closed.y += dy;
        d.open.x += dx; d.open.y += dy;
      }
    }

    function setDoorOpen(open) {
      bell.doorOpen = open;
      for (const d of bell.doors) {
        const target = open ? d.open : d.closed;
        Body.setPosition(d.body, { x: target.x, y: target.y });
        Body.setVelocity(d.body, { x: 0, y: 0 });
      }
    }

    function playerInsideBell() {
      if (!player || !bell.floor) return false;
      const c = bellCenter();
      const p = player.torso.position;
      return Math.abs(p.x - c.x) < 46 && p.y < bell.floor.position.y - 8 && p.y > bell.roof.position.y + 8;
    }

    function carryPlayerWithBell(dx, dy) {
      if (!player) return;
      Composite.translate(player.composite, { x: dx, y: dy });
      for (const b of player.composite.bodies) Body.setVelocity(b, { x: b.velocity.x, y: 0 });
    }

    function createIsland() {
      const ground = Bodies.rectangle(CONFIG.width / 2, CONFIG.islandY + 58, 820, 84, {
        isStatic: true, label: "island",
        render: { fillStyle: "#18241c" }
      });
      const cliffL = Bodies.rectangle(CONFIG.width / 2 - 430, CONFIG.islandY + 10, 70, 180, {
        isStatic: true, render: { fillStyle: "#12181c" }
      });
      const cliffR = Bodies.rectangle(CONFIG.width / 2 + 430, CONFIG.islandY + 10, 70, 180, {
        isStatic: true, render: { fillStyle: "#12181c" }
      });
      return [ground, cliffL, cliffR];
    }

    const keys = {};
    window.addEventListener("keydown", e => {
      keys[e.code] = true;
      if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
    });
    window.addEventListener("keyup", e => {
      keys[e.code] = false;
      if (e.code === "Space") jumpLocked = false;
    });

    const mouse = { x: 0, y: 0, down: false, right: false };
    window.addEventListener("mousemove", e => {
      if (!render) return;
      const rect = render.canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
    });
    window.addEventListener("mousedown", e => {
      if (e.button === 0) mouse.down = true;
      if (e.button === 2) mouse.right = true;
    });
    window.addEventListener("mouseup", e => {
      if (e.button === 0) mouse.down = false;
      if (e.button === 2) mouse.right = false;
    });
    window.addEventListener("contextmenu", e => e.preventDefault());

    function shootHarpoon() {
      if (harpoon || !player || bell.mode === "docked") return;
      const head = player.head.position;
      const worldMouse = {
        x: mouse.x + camera.x - CONFIG.width / 2,
        y: mouse.y + camera.y - CONFIG.height / 2
      };
      const dx = worldMouse.x - head.x;
      const dy = worldMouse.y - head.y;
      const len = Math.hypot(dx, dy) || 1;
      const dir = { x: dx / len, y: dy / len };

      harpoon = Bodies.rectangle(head.x + dir.x * 26, head.y + dir.y * 26, 26, 5, {
        label: "harpoon", density: 0.002, frictionAir: 0.012,
        render: { fillStyle: "#8a9096" }
      });
      Body.setVelocity(harpoon, { x: dir.x * CONFIG.harpoonSpeed, y: dir.y * CONFIG.harpoonSpeed });
      Body.setAngle(harpoon, Math.atan2(dir.y, dir.x));
      harpoonConstraint = Constraint.create({
        bodyA: player.rightArm, bodyB: harpoon,
        stiffness: 0.0001, length: 36,
        render: { strokeStyle: "#6a7076", lineWidth: 2, type: "line" }
      });
      Composite.add(world, [harpoon, harpoonConstraint]);
    }

    function reelHarpoon() {
      if (!harpoon || !harpoonConstraint) return;
      reelActive = true;
      harpoonConstraint.stiffness = 0.045;
    }

    function releaseHarpoon() {
      if (harpoon) Composite.remove(world, harpoon);
      if (harpoonConstraint) Composite.remove(world, harpoonConstraint);
      harpoon = null;
      harpoonConstraint = null;
      reelActive = false;
    }

    function setupCollisions() {
      Events.on(engine, "collisionStart", event => {
        for (const pair of event.pairs) {
          const labels = [pair.bodyA.label, pair.bodyB.label];
          if (labels.includes("harpoon") && (labels.includes("fishHead") || labels.includes("fishBody"))) {
            const fishBody = String(pair.bodyA.label).startsWith("fish") ? pair.bodyA : pair.bodyB;
            const fishEnt = EntityRegistry.entities.find(e => e.segments && e.segments.includes(fishBody));
            if (fishEnt && fishEnt.alive) {
              fishEnt.kill();
              if (harpoonConstraint) {
                harpoonConstraint.bodyB = fishBody;
                harpoonConstraint.stiffness = 0.6;
                harpoonConstraint.length = 8;
              }
              fishEnt.attached = true;
            }
          }
        }
      });

      Events.on(engine, "collisionActive", event => {
        grounded = false;
        for (const pair of event.pairs) {
          const a = pair.bodyA.label;
          const b = pair.bodyB.label;
          const hitLeg = a === "leftLeg" || a === "rightLeg" || b === "leftLeg" || b === "rightLeg" || a === "torso" || b === "torso";
          const hitGround = a === "island" || b === "island" || a === "bellFloor" || b === "bellFloor";
          if (hitLeg && hitGround) grounded = true;
        }
      });
    }

    function tryCollectFish() {
      if (!harpoon || bell.mode === "docked") return;
      const c = bellCenter();
      for (const e of [...EntityRegistry.entities]) {
        if (e.def && !e.alive && e.attached) {
          const headPos = e.head.position;
          if (Math.abs(headPos.y - c.y) < 120 && Math.abs(headPos.x - c.x) < 110) {
            cageInventory.push({
              typeKey: e.typeKey, name: e.def.name, edible: e.def.edible,
              prepRequired: e.def.prepRequired, risk: e.def.risk
            });
            EntityRegistry.remove(e);
            releaseHarpoon();
            updateCageUI();
            showToast("Hauled " + e.def.name + " into the bell.");
          }
        }
      }
    }

    function updateCageUI() {
      const el = document.getElementById("cage-inventory");
      el.innerHTML = "";
      cageInventory.forEach((item, i) => {
        const slot = document.createElement("div");
        slot.className = "inventory-slot bg-zinc-950 border border-stone-700 flex flex-col items-center justify-center text-xs p-1 cursor-pointer hover:border-amber-800";
        slot.innerHTML = '<div class="w-8 h-5" style="background:' + ((CONFIG.fishTypes[item.typeKey] && CONFIG.fishTypes[item.typeKey].color) || "#444") + '"></div><span class="truncate max-w-[56px]">' + item.name.split(" ").pop() + "</span>";
        slot.onclick = () => openPrepModal(i);
        el.appendChild(slot);
      });
    }

    function showToast(msg) {
      const panel = document.getElementById("dialogue-panel");
      document.getElementById("dialogue-speaker").textContent = "Bell";
      document.getElementById("dialogue-text").textContent = msg;
      document.getElementById("dialogue-choices").innerHTML = "";
      panel.classList.remove("hidden");
      setTimeout(() => panel.classList.add("hidden"), 2200);
    }

    function openPrepModal(index) {
      selectedFishForPrep = index;
      const item = cageInventory[index];
      document.getElementById("prep-desc").textContent =
        "You are preparing: " + item.name + ". Correct preparation and identification decide whether the Chef stays healthy.";
      document.getElementById("prep-clean").checked = false;
      document.getElementById("prep-cook").checked = false;
      document.getElementById("prep-identify").checked = false;
      document.getElementById("prep-result").classList.add("hidden");
      document.getElementById("prep-modal").classList.remove("hidden");
      document.getElementById("prep-modal").classList.add("flex");
    }

    document.getElementById("prep-cancel").onclick = () => {
      document.getElementById("prep-modal").classList.add("hidden");
      document.getElementById("prep-modal").classList.remove("flex");
    };

    document.getElementById("prep-confirm").onclick = () => {
      if (selectedFishForPrep == null) return;
      const item = cageInventory[selectedFishForPrep];
      const cleaned = document.getElementById("prep-clean").checked;
      const cooked = document.getElementById("prep-cook").checked;
      const identified = document.getElementById("prep-identify").checked;
      let correct = true;
      let message = "";
      if (!item.edible) {
        if (identified) {
          correct = false;
          message = "Chef is violently ill. This species is not safe for humans.";
        } else {
          message = "You rejected the toxic fish. Chef is safe.";
        }
      } else {
        const needsId = item.prepRequired.indexOf("identify") !== -1;
        if (!cleaned || !cooked || (needsId && !identified)) {
          correct = false;
          message = "Chef feels unwell. A preparation step was missed.";
        } else {
          message = "Safe meal. Chef stays healthy.";
        }
      }
      const resultEl = document.getElementById("prep-result");
      resultEl.textContent = message;
      resultEl.className = "mt-3 text-sm " + (correct ? "text-emerald-500" : "text-red-500");
      resultEl.classList.remove("hidden");
      setTimeout(() => {
        cageInventory.splice(selectedFishForPrep, 1);
        updateCageUI();
        document.getElementById("prep-modal").classList.add("hidden");
        document.getElementById("prep-modal").classList.remove("flex");
        selectedFishForPrep = null;
        showToast(correct ? "Correct preparation." : "Review the preparation steps.");
      }, 2400);
    };

    function createNPC(x, y, name, dialogueLines, options) {
      const hum = createHumanoid(x, y, 0.5, Object.assign({ name: name, shirt: "#3a2a20" }, options || {}));
      for (const b of hum.composite.bodies) Body.setStatic(b, true);
      return {
        composite: hum.composite, head: hum.head, torso: hum.torso,
        dialogue: dialogueLines,
        interact() { showDialogue(name, dialogueLines); }
      };
    }

    function showDialogue(speaker, lines) {
      const panel = document.getElementById("dialogue-panel");
      document.getElementById("dialogue-speaker").textContent = speaker;
      document.getElementById("dialogue-text").textContent = Array.isArray(lines) ? lines[0] : lines;
      document.getElementById("dialogue-choices").innerHTML =
        '<button class="bg-stone-800 hover:bg-stone-700 text-stone-200 text-sm px-3 py-1 border border-stone-600" onclick="document.getElementById(\'dialogue-panel\').classList.add(\'hidden\')">Close</button>';
      panel.classList.remove("hidden");
    }

    function drawBackground() {
      const ctx = render.context;
      const bounds = render.bounds;
      const w = render.options.width;
      const h = render.options.height;
      const surfaceScreenY = CONFIG.islandY - bounds.min.y;

      ctx.fillStyle = "#0a0d11";
      ctx.fillRect(0, 0, w, h);

      if (surfaceScreenY > 0) {
        const skyH = Math.min(h, surfaceScreenY);
        const sky = ctx.createLinearGradient(0, 0, 0, skyH);
        sky.addColorStop(0, "#090b0e");
        sky.addColorStop(1, "#14181e");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, skyH);
      }

      if (surfaceScreenY < h) {
        const y0 = Math.max(0, surfaceScreenY);
        const grad = ctx.createLinearGradient(0, y0, 0, h);
        grad.addColorStop(0, "#102028");
        grad.addColorStop(0.35, "#0a141a");
        grad.addColorStop(1, "#030508");
        ctx.fillStyle = grad;
        ctx.fillRect(0, y0, w, h - y0);
      }
    }

    function drawLabels() {
      const ctx = render.context;
      const bounds = render.bounds;
      const c = bellCenter();
      ctx.fillStyle = "#b8b0a4";
      ctx.font = "12px monospace";
      ctx.textAlign = "center";
      ctx.fillText(bell.doorOpen ? "BELL DOOR OPEN" : "BELL SEALED", c.x - bounds.min.x, c.y - 96 - bounds.min.y);
      ctx.fillText("Chef", CONFIG.width / 2 + 230 - bounds.min.x, CONFIG.islandY - 92 - bounds.min.y);
      ctx.fillText("Shop", CONFIG.width / 2 - 270 - bounds.min.x, CONFIG.islandY - 92 - bounds.min.y);
    }

    function updateBellStatus() {
      const el = document.getElementById("bell-status");
      const door = bell.doorOpen ? "door open" : "door sealed";
      el.textContent = "Bell: " + bell.mode + " · " + door;
    }

    function handleBellCommand() {
      const near = player && Math.hypot(player.torso.position.x - bellCenter().x, player.torso.position.y - bellCenter().y) < 130;
      if (!near && !playerInsideBell()) {
        showToast("Stand in the bell doorway.");
        return;
      }

      if (bell.mode === "docked") {
        if (bell.doorOpen) {
          if (!playerInsideBell()) {
            showToast("Step fully inside before sealing the door.");
            return;
          }
          setDoorOpen(false);
          showToast("Door sealed. Press E again to descend.");
        } else {
          if (!playerInsideBell()) {
            setDoorOpen(true);
            showToast("Door opened.");
            return;
          }
          bell.mode = "descending";
          showToast("Descending. Press E to return to the surface.");
        }
        updateBellStatus();
        return;
      }

      if (bell.mode === "descending" || bell.mode === "holding") {
        bell.mode = "ascending";
        showToast("Ascending.");
        updateBellStatus();
      }
    }

    function stepBell(dt) {
      if (!bell.floor) return;
      let dy = 0;
      if (bell.mode === "descending") {
        dy = CONFIG.descendSpeed;
        if (bell.floor.position.y >= CONFIG.islandY + CONFIG.maxDepth) {
          dy = 0;
          bell.mode = "holding";
        }
      } else if (bell.mode === "ascending") {
        dy = -CONFIG.ascendSpeed;
        const parkY = bell.park.y + 68;
        if (bell.floor.position.y + dy <= parkY) {
          dy = parkY - bell.floor.position.y;
          translateBell(0, dy);
          if (playerInsideBell()) carryPlayerWithBell(0, dy);
          arriveSurface();
          return;
        }
      }

      if (dy !== 0) {
        translateBell(0, dy);
        if (playerInsideBell() || !bell.doorOpen) carryPlayerWithBell(0, dy);
      }
    }

    function arriveSurface() {
      bell.mode = "docked";
      setDoorOpen(true);
      if (player) {
        for (const b of player.composite.bodies) Body.setVelocity(b, { x: 1.2, y: -1.5 });
      }
      showToast("Surface reached. Door open.");
      updateBellStatus();
    }

    function init() {
      engine = Engine.create();
      world = engine.world;
      engine.gravity.x = 0;
      engine.gravity.y = 1.05;

      render = Render.create({
        canvas: document.getElementById("game-canvas"),
        engine: engine,
        options: {
          width: CONFIG.width,
          height: CONFIG.height,
          wireframes: false,
          background: "#07090d",
          hasBounds: true,
          pixelRatio: window.devicePixelRatio || 1
        }
      });

      Composite.add(world, createIsland());
      Composite.add(world, createDivingBell(CONFIG.width / 2, CONFIG.islandY - 36));

      player = createHumanoid(CONFIG.width / 2 - 90, CONFIG.islandY - 80, CONFIG.playerScale, {
        isPlayer: true, name: "Diver", shirt: "#1c252c"
      });
      EntityRegistry.register(player);

      const chef = createNPC(CONFIG.width / 2 + 230, CONFIG.islandY - 42, "Chef",
        "Bring prepared fish. Wrong species or sloppy prep makes me ill.",
        { shirt: "#3b2416", pants: "#140e0a" });
      Body.scale(chef.torso, 1.4, 1.2);
      EntityRegistry.register(chef);

      EntityRegistry.register(createNPC(CONFIG.width / 2 - 270, CONFIG.islandY - 42, "Shop",
        "Seal both bell doors before you drop. Do not dive with them open.",
        { shirt: "#24322a" }));

      const fishSpawns = [
        { x: CONFIG.width / 2 - 120, y: 620, type: "safe_cod" },
        { x: CONFIG.width / 2 + 170, y: 800, type: "passive_sole" },
        { x: CONFIG.width / 2 - 50, y: 980, type: "toxic_puffer" },
        { x: CONFIG.width / 2 + 90, y: 1140, type: "aggressive_barracuda" },
        { x: CONFIG.width / 2 - 190, y: 1320, type: "safe_cod" },
        { x: CONFIG.width / 2 + 30, y: 1520, type: "toxic_puffer" }
      ];
      for (const s of fishSpawns) EntityRegistry.register(createSegmentedFish(s.x, s.y, s.type));

      for (let i = 0; i < 10; i++) {
        Composite.add(world, Bodies.rectangle(
          90 + Math.random() * (CONFIG.width - 180),
          520 + Math.random() * 1400,
          36 + Math.random() * 70,
          22 + Math.random() * 40,
          { isStatic: true, render: { fillStyle: "#151a20" } }
        ));
      }

      setupCollisions();
      Events.on(render, "beforeRender", drawBackground);
      Events.on(render, "afterRender", drawLabels);
      Runner.run(Runner.create(), engine);
      Render.run(render);
      updateBellStatus();

      let last = performance.now();
      function loop(now) {
        const dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        update(dt);
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);

      window.addEventListener("resize", () => {
        CONFIG.width = window.innerWidth;
        CONFIG.height = window.innerHeight;
        render.options.width = CONFIG.width;
        render.options.height = CONFIG.height;
        render.canvas.width = CONFIG.width;
        render.canvas.height = CONFIG.height;
      });
    }

    function update(dt) {
      if (!player) return;

      if (keys.KeyE) {
        keys.KeyE = false;
        handleBellCommand();
      }

      stepBell(dt);

      const torso = player.torso;
      let vx = torso.velocity.x;
      const left = keys.KeyA || keys.ArrowLeft;
      const right = keys.KeyD || keys.ArrowRight;
      if (left && !right) vx = -CONFIG.walkSpeed;
      else if (right && !left) vx = CONFIG.walkSpeed;
      else vx *= 0.78;

      let vy = torso.velocity.y;
      if (vy < -8) vy = -8;
      if (vy > 16) vy = 16;

      if ((keys.Space) && grounded && !jumpLocked) {
        vy = -CONFIG.jumpSpeed;
        jumpLocked = true;
        grounded = false;
      }

      Body.setVelocity(torso, { x: vx, y: vy });

      if (bell.mode !== "docked") {
        oxygen -= CONFIG.oxygenDrainPerSec * dt;
        if (oxygen <= 0) {
          oxygen = 0;
          bell.mode = "ascending";
          showToast("Oxygen gone. Bell returning.");
          updateBellStatus();
        }
      } else {
        oxygen = Math.min(100, oxygen + 18 * dt);
      }

      if (mouse.down && bell.mode !== "docked") {
        shootHarpoon();
        mouse.down = false;
      }
      if (mouse.right && harpoon) reelHarpoon();
      if (reelActive && harpoon && harpoonConstraint) {
        const target = player.rightArm.position;
        const dir = Vector.sub(target, harpoon.position);
        if (Vector.magnitude(dir) > 20) {
          Body.applyForce(harpoon, harpoon.position, Vector.mult(Vector.normalise(dir), CONFIG.reelForce));
        }
        tryCollectFish();
      }

      EntityRegistry.update(dt);

      const head = player.getHeadPos();
      camera.x = CONFIG.width / 2;
      camera.y = head.y;
      Render.lookAt(render, {
        min: { x: camera.x - CONFIG.width / 2, y: camera.y - CONFIG.height / 2 },
        max: { x: camera.x + CONFIG.width / 2, y: camera.y + CONFIG.height / 2 }
      });

      const currentDepth = Math.max(0, Math.round((bell.floor.position.y - (bell.park.y + 68)) / 10));
      document.getElementById("depth-display").textContent = currentDepth + " m";
      const ox = document.getElementById("oxygen-display");
      ox.textContent = Math.round(oxygen) + "%";
      ox.style.color = oxygen < 30 ? "#c44" : "#9aa";
    }

    window.addEventListener("load", init);
  </script>
</body>
</html>
