<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health &amp; Safety Dive – Level 3 Game Dev Prototype</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #7ec8e3; height: 100%; }
    #game-canvas { display: block; width: 100vw; height: 100vh; background: #7ec8e3; }
    .ui-panel { pointer-events: auto; }
    .dialogue-box { max-width: 420px; }
    .inventory-slot { min-width: 64px; min-height: 64px; }
  </style>
</head>
<body class="relative select-none">
  <canvas id="game-canvas"></canvas>

  <div id="ui-root" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-4">
    <div class="flex justify-between items-start">
      <div class="ui-panel bg-slate-900/80 text-white rounded-xl px-4 py-2 shadow-lg border border-slate-600">
        <div class="text-xs text-cyan-300 uppercase tracking-wider">Health &amp; Safety Dive</div>
        <div class="text-sm mt-1">Depth: <span id="depth-display">0 m</span> · Oxygen: <span id="oxygen-display">100%</span></div>
        <div class="text-xs text-slate-400 mt-1">WASD move · Mouse aim · LMB shoot harpoon · RMB reel · E interact</div>
      </div>
      <div class="ui-panel bg-slate-900/80 text-white rounded-xl px-4 py-2 shadow-lg border border-slate-600">
        <div class="text-xs text-amber-300">Cage Inventory</div>
        <div id="cage-inventory" class="flex gap-2 mt-2"></div>
      </div>
    </div>
    <div class="flex justify-center">
      <div id="dialogue-panel" class="ui-panel dialogue-box hidden bg-slate-900/95 text-white rounded-2xl p-5 shadow-2xl border border-cyan-700/50">
        <div id="dialogue-speaker" class="text-cyan-300 font-semibold mb-1"></div>
        <div id="dialogue-text" class="text-sm leading-relaxed"></div>
        <div id="dialogue-choices" class="mt-3 flex flex-wrap gap-2"></div>
      </div>
    </div>
  </div>

  <div id="prep-modal" class="absolute inset-0 hidden items-center justify-center bg-black/60 pointer-events-auto">
    <div class="bg-slate-900 text-white rounded-2xl p-6 w-full max-w-md border border-amber-600/40 shadow-2xl">
      <h2 class="text-xl font-bold text-amber-300 mb-2">Prepare Fish</h2>
      <p id="prep-desc" class="text-sm text-slate-300 mb-4"></p>
      <div class="space-y-2 mb-4">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="prep-clean" class="rounded" />
          <span>Clean thoroughly (remove guts / scales)</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="prep-cook" class="rounded" />
          <span>Cook properly</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="prep-identify" class="rounded" />
          <span>Confirm species is edible for humans</span>
        </label>
      </div>
      <div class="flex gap-3">
        <button id="prep-confirm" class="flex-1 bg-cyan-600 hover:bg-cyan-500 rounded-lg py-2 font-medium">Feed to Chef</button>
        <button id="prep-cancel" class="px-4 bg-slate-700 hover:bg-slate-600 rounded-lg py-2">Cancel</button>
      </div>
      <p id="prep-result" class="mt-3 text-sm hidden"></p>
    </div>
  </div>

  <script>
    const { Engine, Render, Runner, Bodies, Body, Composite, Constraint, Events, Vector } = Matter;

    function shadeHex(hex, amount) {
      const raw = String(hex || "#888888").replace("#", "");
      const full = raw.length === 3 ? raw.split("").map(c => c + c).join("") : raw;
      const num = parseInt(full, 16);
      const r = Math.max(0, Math.min(255, ((num >> 16) & 255) + amount));
      const g = Math.max(0, Math.min(255, ((num >> 8) & 255) + amount));
      const b = Math.max(0, Math.min(255, (num & 255) + amount));
      return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    const CONFIG = {
      width: window.innerWidth,
      height: window.innerHeight,
      islandY: 220,
      playerScale: 0.55,
      harpoonSpeed: 18,
      reelForce: 0.008,
      oxygenDrainPerSec: 4,
      fishTypes: {
        safe_cod: { name: "Atlantic Cod", color: "#5b8def", segments: 6, length: 70, speed: 1.4, aggression: 0.1, edible: true, prepRequired: ["clean", "cook", "identify"], risk: "low" },
        toxic_puffer: { name: "Pufferfish", color: "#f0c040", segments: 5, length: 55, speed: 1.1, aggression: 0.6, edible: false, prepRequired: ["clean", "cook", "identify"], risk: "high" },
        passive_sole: { name: "Dover Sole", color: "#c9a66b", segments: 7, length: 60, speed: 0.9, aggression: 0.0, edible: true, prepRequired: ["clean", "cook"], risk: "low" },
        aggressive_barracuda: { name: "Barracuda", color: "#4a7c59", segments: 8, length: 95, speed: 2.2, aggression: 0.85, edible: true, prepRequired: ["clean", "cook", "identify"], risk: "medium" }
      }
    };

    let engine, world, render;
    let player = null;
    let camera = { x: 0, y: 0 };
    let isDiving = false;
    let oxygen = 100;
    let harpoon = null;
    let harpoonConstraint = null;
    let reelActive = false;
    let cageInventory = [];
    let selectedFishForPrep = null;

    const EntityRegistry = {
      entities: [],
      register(ent) {
        this.entities.push(ent);
        if (ent.composite) Composite.add(world, ent.composite);
        else if (ent.body) Composite.add(world, ent.body);
        return ent;
      },
      remove(ent) {
        const idx = this.entities.indexOf(ent);
        if (idx >= 0) this.entities.splice(idx, 1);
        if (ent.composite) Composite.remove(world, ent.composite);
        else if (ent.body) Composite.remove(world, ent.body);
      },
      update(dt) {
        for (const e of this.entities) if (e.update) e.update(dt);
      }
    };

    function createHumanoid(x, y, scale, options) {
      options = options || {};
      const group = Body.nextGroup(true);
      const head = Bodies.circle(x, y - 45 * scale, 14 * scale, {
        label: "head", collisionFilter: { group },
        render: { fillStyle: options.skin || "#f5c6a0" }, density: 0.001
      });
      const torso = Bodies.rectangle(x, y, 22 * scale, 38 * scale, {
        label: "torso", collisionFilter: { group }, chamfer: { radius: 6 * scale },
        render: { fillStyle: options.shirt || "#2b6cb0" }, density: 0.002
      });
      const leftArm = Bodies.rectangle(x - 20 * scale, y - 5 * scale, 10 * scale, 28 * scale, {
        label: "leftArm", collisionFilter: { group }, chamfer: { radius: 4 },
        render: { fillStyle: options.skin || "#f5c6a0" }, density: 0.0008
      });
      const rightArm = Bodies.rectangle(x + 20 * scale, y - 5 * scale, 10 * scale, 28 * scale, {
        label: "rightArm", collisionFilter: { group }, chamfer: { radius: 4 },
        render: { fillStyle: options.skin || "#f5c6a0" }, density: 0.0008
      });
      const leftLeg = Bodies.rectangle(x - 8 * scale, y + 35 * scale, 11 * scale, 32 * scale, {
        label: "leftLeg", collisionFilter: { group }, chamfer: { radius: 4 },
        render: { fillStyle: options.pants || "#1a365d" }, density: 0.0012
      });
      const rightLeg = Bodies.rectangle(x + 8 * scale, y + 35 * scale, 11 * scale, 32 * scale, {
        label: "rightLeg", collisionFilter: { group }, chamfer: { radius: 4 },
        render: { fillStyle: options.pants || "#1a365d" }, density: 0.0012
      });

      const constraints = [
        Constraint.create({ bodyA: head, bodyB: torso, pointA: { x: 0, y: 14 * scale }, pointB: { x: 0, y: -19 * scale }, stiffness: 0.9, length: 2 }),
        Constraint.create({ bodyA: torso, bodyB: leftArm, pointA: { x: -11 * scale, y: -12 * scale }, pointB: { x: 0, y: -12 * scale }, stiffness: 0.6, length: 4 }),
        Constraint.create({ bodyA: torso, bodyB: rightArm, pointA: { x: 11 * scale, y: -12 * scale }, pointB: { x: 0, y: -12 * scale }, stiffness: 0.6, length: 4 }),
        Constraint.create({ bodyA: torso, bodyB: leftLeg, pointA: { x: -6 * scale, y: 19 * scale }, pointB: { x: 0, y: -14 * scale }, stiffness: 0.7, length: 3 }),
        Constraint.create({ bodyA: torso, bodyB: rightLeg, pointA: { x: 6 * scale, y: 19 * scale }, pointB: { x: 0, y: -14 * scale }, stiffness: 0.7, length: 3 })
      ];

      const composite = Composite.create({
        bodies: [head, torso, leftArm, rightArm, leftLeg, rightLeg],
        constraints
      });

      return {
        composite, head, torso, leftArm, rightArm, leftLeg, rightLeg, scale,
        isPlayer: !!options.isPlayer,
        name: options.name || "Humanoid",
        applyForceToTorso(fx, fy) { Body.applyForce(torso, torso.position, { x: fx, y: fy }); },
        getHeadPos() { return head.position; },
        setPosition(nx, ny) {
          Composite.translate(composite, { x: nx - torso.position.x, y: ny - torso.position.y });
        }
      };
    }

    function createSegmentedFish(x, y, typeKey) {
      const def = CONFIG.fishTypes[typeKey] || CONFIG.fishTypes.safe_cod;
      const group = Body.nextGroup(true);
      const segs = [];
      const constraints = [];
      const segW = def.length / def.segments;
      const segH = 12 + (def.segments > 6 ? 4 : 0);

      for (let i = 0; i < def.segments; i++) {
        const isHead = i === 0;
        const body = Bodies.rectangle(
          x + i * segW * 0.85, y,
          isHead ? segW * 1.1 : segW,
          isHead ? segH * 1.15 : segH,
          {
            label: isHead ? "fishHead" : "fishBody",
            collisionFilter: { group },
            chamfer: { radius: isHead ? 8 : 5 },
            render: { fillStyle: isHead ? shadeHex(def.color, -30) : def.color },
            density: 0.0006,
            frictionAir: 0.04
          }
        );
        segs.push(body);
        if (i > 0) {
          constraints.push(Constraint.create({
            bodyA: segs[i - 1], bodyB: body,
            pointA: { x: segW * 0.4, y: 0 }, pointB: { x: -segW * 0.4, y: 0 },
            stiffness: 0.85, damping: 0.1, length: 2
          }));
        }
      }

      const tail = Bodies.polygon(x + def.segments * segW * 0.85, y, 3, 10, {
        label: "fishTail", collisionFilter: { group },
        render: { fillStyle: shadeHex(def.color, -40) }, density: 0.0003
      });
      constraints.push(Constraint.create({ bodyA: segs[segs.length - 1], bodyB: tail, stiffness: 0.6, length: 6 }));
      segs.push(tail);

      const composite = Composite.create({ bodies: segs, constraints });

      return {
        composite, head: segs[0], segments: segs, typeKey, def,
        alive: true, targetDir: Math.random() * Math.PI * 2,
        aggression: def.aggression, speed: def.speed,
        update() {
          if (!this.alive) return;
          if (Math.random() < 0.02) this.targetDir += (Math.random() - 0.5) * 1.2;
          if (player) {
            const dx = player.torso.position.x - this.head.position.x;
            const dy = player.torso.position.y - this.head.position.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 280) {
              if (this.aggression > 0.5) this.targetDir = Math.atan2(dy, dx);
              else if (this.aggression < 0.2) this.targetDir = Math.atan2(-dy, -dx);
            }
          }
          const force = 0.00025 * this.speed;
          Body.applyForce(this.head, this.head.position, {
            x: Math.cos(this.targetDir) * force,
            y: Math.sin(this.targetDir) * force
          });
          Body.applyForce(this.head, this.head.position, { x: 0, y: -0.00004 });
        },
        kill() {
          this.alive = false;
          for (const c of this.composite.constraints) c.stiffness = 0.15;
        }
      };
    }

    function createDivingCage(x, y) {
      const cage = Bodies.rectangle(x, y, 90, 110, {
        isStatic: true, label: "cage",
        render: { fillStyle: "#94a3b8", strokeStyle: "#e2e8f0", lineWidth: 3 },
        chamfer: { radius: 8 }
      });
      const bars = [];
      for (let i = -1; i <= 1; i++) {
        bars.push(Bodies.rectangle(x + i * 28, y, 6, 100, {
          isStatic: true, render: { fillStyle: "#334155" }
        }));
      }
      return { body: cage, bars, x, y };
    }

    function createIsland() {
      return Bodies.rectangle(CONFIG.width / 2, CONFIG.islandY + 50, 760, 90, {
        isStatic: true, label: "island",
        render: { fillStyle: "#3d6b4f" },
        chamfer: { radius: 12 }
      });
    }

    const keys = {};
    window.addEventListener("keydown", e => {
      keys[e.code] = true;
      if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
    });
    window.addEventListener("keyup", e => { keys[e.code] = false; });

    const mouse = { x: 0, y: 0, down: false, right: false };
    window.addEventListener("mousemove", e => {
      if (!render) return;
      const rect = render.canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
    });
    window.addEventListener("mousedown", e => {
      if (e.button === 0) mouse.down = true;
      if (e.button === 2) mouse.right = true;
    });
    window.addEventListener("mouseup", e => {
      if (e.button === 0) mouse.down = false;
      if (e.button === 2) mouse.right = false;
    });
    window.addEventListener("contextmenu", e => e.preventDefault());

    function shootHarpoon() {
      if (harpoon || !player || !isDiving) return;
      const head = player.head.position;
      const worldMouse = {
        x: mouse.x + camera.x - CONFIG.width / 2,
        y: mouse.y + camera.y - CONFIG.height / 2
      };
      const dx = worldMouse.x - head.x;
      const dy = worldMouse.y - head.y;
      const len = Math.hypot(dx, dy) || 1;
      const dir = { x: dx / len, y: dy / len };

      harpoon = Bodies.rectangle(head.x + dir.x * 30, head.y + dir.y * 30, 28, 6, {
        label: "harpoon", density: 0.002, frictionAir: 0.01,
        render: { fillStyle: "#cbd5e1" }, chamfer: { radius: 2 }
      });
      Body.setVelocity(harpoon, { x: dir.x * CONFIG.harpoonSpeed, y: dir.y * CONFIG.harpoonSpeed });
      Body.setAngle(harpoon, Math.atan2(dir.y, dir.x));

      harpoonConstraint = Constraint.create({
        bodyA: player.rightArm, bodyB: harpoon,
        stiffness: 0.0001, length: 40,
        render: { strokeStyle: "#e2e8f0", lineWidth: 2, type: "line" }
      });
      Composite.add(world, [harpoon, harpoonConstraint]);
    }

    function reelHarpoon() {
      if (!harpoon || !harpoonConstraint) return;
      reelActive = true;
      harpoonConstraint.stiffness = 0.04;
    }

    function releaseHarpoon() {
      if (harpoon) Composite.remove(world, harpoon);
      if (harpoonConstraint) Composite.remove(world, harpoonConstraint);
      harpoon = null;
      harpoonConstraint = null;
      reelActive = false;
    }

    function setupCollisions() {
      Events.on(engine, "collisionStart", event => {
        for (const pair of event.pairs) {
          const labels = [pair.bodyA.label, pair.bodyB.label];
          if (labels.includes("harpoon") && (labels.includes("fishHead") || labels.includes("fishBody"))) {
            const fishBody = String(pair.bodyA.label).startsWith("fish") ? pair.bodyA : pair.bodyB;
            const fishEnt = EntityRegistry.entities.find(e => e.segments && e.segments.includes(fishBody));
            if (fishEnt && fishEnt.alive) {
              fishEnt.kill();
              if (harpoonConstraint) {
                harpoonConstraint.bodyB = fishBody;
                harpoonConstraint.stiffness = 0.6;
                harpoonConstraint.length = 8;
              }
              fishEnt.attached = true;
            }
          }
        }
      });
    }

    function tryCollectFish() {
      if (!harpoon || !isDiving) return;
      const cagePos = { x: CONFIG.width / 2, y: CONFIG.islandY + 20 };
      for (const e of [...EntityRegistry.entities]) {
        if (e.def && !e.alive && e.attached) {
          const headPos = e.head.position;
          if (Math.abs(headPos.y - cagePos.y) < 140 && Math.abs(headPos.x - cagePos.x) < 160) {
            cageInventory.push({
              typeKey: e.typeKey, name: e.def.name, edible: e.def.edible,
              prepRequired: e.def.prepRequired, risk: e.def.risk
            });
            EntityRegistry.remove(e);
            releaseHarpoon();
            updateCageUI();
            showToast("Collected " + e.def.name);
          }
        }
      }
    }

    function updateCageUI() {
      const el = document.getElementById("cage-inventory");
      el.innerHTML = "";
      cageInventory.forEach((item, i) => {
        const slot = document.createElement("div");
        slot.className = "inventory-slot bg-slate-800 border border-slate-600 rounded-lg flex flex-col items-center justify-center text-xs p-1 cursor-pointer hover:border-cyan-400";
        slot.innerHTML = '<div class="w-8 h-5 rounded" style="background:' + (CONFIG.fishTypes[item.typeKey] && CONFIG.fishTypes[item.typeKey].color || "#888") + '"></div><span class="truncate max-w-[56px]">' + item.name.split(" ").pop() + "</span>";
        slot.onclick = () => openPrepModal(i);
        el.appendChild(slot);
      });
    }

    function showToast(msg) {
      const panel = document.getElementById("dialogue-panel");
      document.getElementById("dialogue-speaker").textContent = "System";
      document.getElementById("dialogue-text").textContent = msg;
      document.getElementById("dialogue-choices").innerHTML = "";
      panel.classList.remove("hidden");
      setTimeout(() => panel.classList.add("hidden"), 2200);
    }

    function openPrepModal(index) {
      selectedFishForPrep = index;
      const item = cageInventory[index];
      document.getElementById("prep-desc").textContent =
        "You are preparing: " + item.name + ". Correct preparation and correct identification determine whether the Chef stays healthy.";
      document.getElementById("prep-clean").checked = false;
      document.getElementById("prep-cook").checked = false;
      document.getElementById("prep-identify").checked = false;
      document.getElementById("prep-result").classList.add("hidden");
      document.getElementById("prep-modal").classList.remove("hidden");
      document.getElementById("prep-modal").classList.add("flex");
    }

    document.getElementById("prep-cancel").onclick = () => {
      document.getElementById("prep-modal").classList.add("hidden");
      document.getElementById("prep-modal").classList.remove("flex");
    };

    document.getElementById("prep-confirm").onclick = () => {
      if (selectedFishForPrep == null) return;
      const item = cageInventory[selectedFishForPrep];
      const cleaned = document.getElementById("prep-clean").checked;
      const cooked = document.getElementById("prep-cook").checked;
      const identified = document.getElementById("prep-identify").checked;
      let correct = true;
      let message = "";

      if (!item.edible) {
        if (identified) {
          correct = false;
          message = "Chef is violently ill! This species is toxic / not safe for humans.";
        } else {
          message = "You correctly rejected the toxic fish. Chef is safe (and a bit hungry).";
        }
      } else {
        const needsId = item.prepRequired.indexOf("identify") !== -1;
        if (!cleaned || !cooked || (needsId && !identified)) {
          correct = false;
          message = "Chef feels unwell. You missed a critical preparation step.";
        } else {
          message = "Delicious and safe! Chef is happy and healthy.";
        }
      }

      const resultEl = document.getElementById("prep-result");
      resultEl.textContent = message;
      resultEl.className = "mt-3 text-sm " + (correct ? "text-emerald-400" : "text-rose-400");
      resultEl.classList.remove("hidden");

      setTimeout(() => {
        cageInventory.splice(selectedFishForPrep, 1);
        updateCageUI();
        document.getElementById("prep-modal").classList.add("hidden");
        document.getElementById("prep-modal").classList.remove("flex");
        selectedFishForPrep = null;
        showToast(correct ? "Correct preparation – good health & safety practice!" : "Review the preparation steps.");
      }, 2600);
    };

    function createNPC(x, y, name, dialogueLines, options) {
      const hum = createHumanoid(x, y, 0.5, Object.assign({ name: name, shirt: "#7c3aed" }, options || {}));
      for (const b of hum.composite.bodies) Body.setStatic(b, true);
      return {
        composite: hum.composite, head: hum.head, torso: hum.torso,
        dialogue: dialogueLines,
        interact() { showDialogue(name, dialogueLines); }
      };
    }

    function showDialogue(speaker, lines) {
      const panel = document.getElementById("dialogue-panel");
      document.getElementById("dialogue-speaker").textContent = speaker;
      document.getElementById("dialogue-text").textContent = Array.isArray(lines) ? lines[0] : lines;
      document.getElementById("dialogue-choices").innerHTML =
        '<button class="bg-cyan-700 hover:bg-cyan-600 text-white text-sm px-3 py-1 rounded-lg" onclick="document.getElementById(\'dialogue-panel\').classList.add(\'hidden\')">Close</button>';
      panel.classList.remove("hidden");
    }

    function drawBackground() {
      const ctx = render.context;
      const bounds = render.bounds;
      const w = render.options.width;
      const h = render.options.height;
      const surfaceScreenY = CONFIG.islandY - bounds.min.y;

      ctx.fillStyle = "#7ec8e3";
      ctx.fillRect(0, 0, w, h);

      if (surfaceScreenY < h) {
        const y0 = Math.max(0, surfaceScreenY);
        const grad = ctx.createLinearGradient(0, y0, 0, h);
        grad.addColorStop(0, "#2b8fb8");
        grad.addColorStop(0.45, "#0b4a66");
        grad.addColorStop(1, "#062433");
        ctx.fillStyle = grad;
        ctx.fillRect(0, y0, w, h - y0);
      }
    }

    function drawLabels() {
      const ctx = render.context;
      const bounds = render.bounds;
      ctx.fillStyle = "#0f172a";
      ctx.font = "13px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("DIVING CAGE – press E", CONFIG.width / 2 - bounds.min.x, CONFIG.islandY - 80 - bounds.min.y);
      ctx.fillText("Chef Boris", CONFIG.width / 2 + 220 - bounds.min.x, CONFIG.islandY - 90 - bounds.min.y);
      ctx.fillText("Marina (shop)", CONFIG.width / 2 - 260 - bounds.min.x, CONFIG.islandY - 90 - bounds.min.y);
    }

    function init() {
      engine = Engine.create();
      world = engine.world;
      engine.gravity.x = 0;
      engine.gravity.y = 0.6;

      render = Render.create({
        canvas: document.getElementById("game-canvas"),
        engine: engine,
        options: {
          width: CONFIG.width,
          height: CONFIG.height,
          wireframes: false,
          background: "#7ec8e3",
          hasBounds: true,
          showAngleIndicator: false,
          pixelRatio: window.devicePixelRatio || 1
        }
      });

      Composite.add(world, createIsland());

      const cage = createDivingCage(CONFIG.width / 2, CONFIG.islandY - 10);
      Composite.add(world, [cage.body].concat(cage.bars));

      player = createHumanoid(CONFIG.width / 2 - 80, CONFIG.islandY - 70, CONFIG.playerScale, {
        isPlayer: true, name: "Diver", shirt: "#0e7490"
      });
      EntityRegistry.register(player);

      const chef = createNPC(CONFIG.width / 2 + 220, CONFIG.islandY - 40, "Chef Boris",
        "Bring me properly prepared fish! I get sick easily – correct cleaning, cooking and species knowledge keep me healthy.",
        { shirt: "#b45309", pants: "#451a03" });
      Body.scale(chef.torso, 1.35, 1.25);
      EntityRegistry.register(chef);

      const shopkeeper = createNPC(CONFIG.width / 2 - 260, CONFIG.islandY - 40, "Marina",
        "Welcome to the island shop. Buy basic gear later. For now, use the diving cage in the centre to descend.",
        { shirt: "#059669" });
      EntityRegistry.register(shopkeeper);

      const fishSpawns = [
        { x: CONFIG.width / 2 - 120, y: 600, type: "safe_cod" },
        { x: CONFIG.width / 2 + 180, y: 780, type: "passive_sole" },
        { x: CONFIG.width / 2 - 60, y: 950, type: "toxic_puffer" },
        { x: CONFIG.width / 2 + 90, y: 1100, type: "aggressive_barracuda" },
        { x: CONFIG.width / 2 - 200, y: 1300, type: "safe_cod" },
        { x: CONFIG.width / 2 + 40, y: 1500, type: "toxic_puffer" }
      ];
      for (const s of fishSpawns) EntityRegistry.register(createSegmentedFish(s.x, s.y, s.type));

      for (let i = 0; i < 8; i++) {
        Composite.add(world, Bodies.rectangle(
          80 + Math.random() * (CONFIG.width - 160),
          500 + Math.random() * 1400,
          40 + Math.random() * 60,
          30 + Math.random() * 40,
          { isStatic: true, render: { fillStyle: "#334155" }, chamfer: { radius: 8 } }
        ));
      }

      setupCollisions();
      Events.on(render, "beforeRender", drawBackground);
      Events.on(render, "afterRender", drawLabels);

      Runner.run(Runner.create(), engine);
      Render.run(render);

      let last = performance.now();
      function loop(now) {
        const dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        update(dt);
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);

      window.addEventListener("resize", () => {
        CONFIG.width = window.innerWidth;
        CONFIG.height = window.innerHeight;
        render.options.width = CONFIG.width;
        render.options.height = CONFIG.height;
        render.canvas.width = CONFIG.width;
        render.canvas.height = CONFIG.height;
      });
    }

    function update(dt) {
      if (!player) return;

      const moveForce = isDiving ? 0.0018 : 0.0035;
      if (keys.KeyA || keys.ArrowLeft) player.applyForceToTorso(-moveForce, 0);
      if (keys.KeyD || keys.ArrowRight) player.applyForceToTorso(moveForce, 0);
      if (keys.KeyW || keys.ArrowUp) player.applyForceToTorso(0, -moveForce * 1.1);
      if (keys.KeyS || keys.ArrowDown) player.applyForceToTorso(0, moveForce * 0.9);

      const cageX = CONFIG.width / 2;
      const cageY = CONFIG.islandY;
      const distToCage = Math.hypot(player.torso.position.x - cageX, player.torso.position.y - cageY);
      if (keys.KeyE && distToCage < 110) {
        isDiving = !isDiving;
        keys.KeyE = false;
        if (isDiving) {
          player.setPosition(cageX, cageY + 90);
          engine.gravity.y = 0.22;
          showToast("Diving suit equipped. Descend carefully. Watch oxygen.");
        } else {
          player.setPosition(cageX - 60, cageY - 50);
          engine.gravity.y = 0.6;
          oxygen = Math.min(100, oxygen + 20);
          showToast("Surfaced. Oxygen recovering.");
        }
      }

      if (isDiving) {
        oxygen -= CONFIG.oxygenDrainPerSec * dt;
        if (oxygen <= 0) {
          oxygen = 0;
          isDiving = false;
          player.setPosition(cageX - 60, cageY - 50);
          engine.gravity.y = 0.6;
          showToast("Oxygen depleted – forced return to surface!");
        }
      } else {
        oxygen = Math.min(100, oxygen + 15 * dt);
      }

      if (mouse.down && isDiving) {
        shootHarpoon();
        mouse.down = false;
      }
      if (mouse.right && harpoon) reelHarpoon();

      if (reelActive && harpoon && harpoonConstraint) {
        const target = player.rightArm.position;
        const dir = Vector.sub(target, harpoon.position);
        const dist = Vector.magnitude(dir);
        if (dist > 20) Body.applyForce(harpoon, harpoon.position, Vector.mult(Vector.normalise(dir), CONFIG.reelForce));
        tryCollectFish();
      }

      EntityRegistry.update(dt);

      const head = player.getHeadPos();
      camera.x = CONFIG.width / 2;
      camera.y = head.y;
      Render.lookAt(render, {
        min: { x: camera.x - CONFIG.width / 2, y: camera.y - CONFIG.height / 2 },
        max: { x: camera.x + CONFIG.width / 2, y: camera.y + CONFIG.height / 2 }
      });

      const currentDepth = Math.max(0, Math.round((head.y - CONFIG.islandY) / 10));
      document.getElementById("depth-display").textContent = currentDepth + " m";
      const ox = document.getElementById("oxygen-display");
      ox.textContent = Math.round(oxygen) + "%";
      ox.style.color = oxygen < 30 ? "#f87171" : "#67e8f9";
    }

    window.addEventListener("load", init);
  </script>
</body>
</html>
